[project]
name = "vayu"
version = "0.1.0"
description = "India air-pollution transport simulator server"
requires-python = ">=3.12"
dependencies = ["numpy", "shapely"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vayu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
