[project]
name = "vayu"
version = "0.1.0"
description = "India air-pollution transport simulator server"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "shapely",
    "httpx",
    "pillow",
    "netcdf4>=1.7.5.1.post1",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vayu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # starlette's TestClient prefers httpx2, which is not a dependency here
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
